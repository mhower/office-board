/* Layout: a 16:9 TV wall board. Left: time + weather over the Flatirons. Right: what's next, today, the days ahead.
   Single dark theme on purpose: it lives on a TV. Gold carries the CU accent. */
:root {
  --ground: #121314;
  --panel: #1a1b1d;
  --line: #2a2b2e;
  --ink: #ece8df;
  --muted: #8f8b83;
  --gold: #cfb87c;          /* CU gold */
  --gold-hi: #d9c48e;
  --gold-dim: #6b5f40;
  --gold-wash: rgba(207, 184, 124, .08);
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--ground); color: var(--ink);
  font-family: var(--body); font-size: clamp(14px, 1.05vw, 30px);
  overflow: hidden; -webkit-font-smoothing: antialiased;
}

.screen { position: relative; z-index: 1; height: 100%; display: grid; grid-template-rows: minmax(0, 1fr); border-top: 4px solid var(--gold); box-sizing: border-box; }
.board {
  position: relative; z-index: 1; min-height: 0;
  box-sizing: border-box;
  padding-block: 2.2vw 1.6vw; padding-inline: max(16px, 3vw);
  display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.3fr); gap: 3vw;
  transition: transform 2s ease, opacity 3s ease;
}
.board.night { opacity: .5; }
.col { display: flex; flex-direction: column; gap: 1.8vw; min-width: 0; min-height: 0; }
.label {
  font-family: var(--display); font-weight: 600; text-transform: uppercase;
  letter-spacing: .14em; font-size: .82em; color: var(--gold);
}
.num { font-variant-numeric: tabular-nums; }

/* Clock */
.clock { font-family: var(--display); font-weight: 500; line-height: .82; font-size: 10.5vw; letter-spacing: -.01em; }
.clock .ap { font-size: .26em; font-weight: 500; color: var(--gold); margin-left: .12em; letter-spacing: .04em; }
.date { font-family: var(--display); font-size: 2.3vw; font-weight: 400; color: var(--ink); margin-top: .5vw; }
.date b { color: var(--gold); font-weight: 500; }

/* Weather */
.wx { border-top: 1px solid var(--gold-dim); padding-top: 1.8vw; display: flex; flex-direction: column; gap: 1.6vw; }
.wx-now { display: flex; align-items: center; gap: 1.6vw; }
.wx-now svg { width: 5.4vw; height: 5.4vw; color: var(--gold); flex: none; }
.wx-temp { font-family: var(--display); font-size: 6vw; line-height: .9; font-weight: 500; }
.wx-temp sup { font-size: .45em; vertical-align: top; position: relative; top: .1em; color: var(--gold); }
.wx-desc { display: flex; flex-direction: column; gap: .3em; min-width: 0; }
.wx-cond { font-family: var(--display); font-size: 1.9vw; }
.wx-meta { color: var(--muted); font-size: 1em; }
.forecast { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .6vw; }
.fday { display: flex; flex-direction: column; align-items: center; gap: .45em; padding-block: .9vw; border-radius: 6px; border: 1px solid transparent; }
.fday.today { background: var(--gold-wash); border-color: var(--gold-dim); }
.fday svg { width: 2.4vw; height: 2.4vw; color: var(--gold); }
.fday .hi { font-family: var(--display); font-size: 1.6vw; }
.fday .lo { color: var(--muted); }
.fday .pop { font-size: .82em; color: #8fb6d6; min-height: 1.2em; }

/* Flatirons line art fills the space under the weather */
.range { position: absolute; left: 0; right: 0; bottom: 0; z-index: 0; display: flex; pointer-events: none; opacity: .6; transition: opacity 3s ease; }
.range.night { opacity: .3; }

/* Next game + record */
.game { border-top: 1px solid var(--gold-dim); padding-top: 1.5vw; display: flex; flex-direction: column; gap: .55vw; text-shadow: 0 0 10px var(--ground), 0 0 4px var(--ground); }
.game-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1em; }
.game-when { font-family: var(--display); font-size: 1.7vw; color: var(--gold); font-weight: 600; }
.game-when.live::before { content: ""; display: inline-block; width: .5em; height: .5em; border-radius: 50%; background: var(--gold); margin-right: .4em; vertical-align: .12em; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.game-opp { font-family: var(--display); font-size: 2.8vw; font-weight: 600; line-height: 1; overflow-wrap: anywhere; }
.game-opp .ha { color: var(--gold); font-weight: 500; font-size: .62em; margin-right: .3em; text-transform: uppercase; letter-spacing: .06em; }
.game-opp .rk { color: var(--gold); font-size: .62em; font-weight: 500; margin-right: .15em; }
.game-score { font-family: var(--display); font-size: 2.8vw; font-weight: 600; line-height: 1; }
.game-score .w { color: var(--gold); }
.game-sub { color: var(--muted); display: flex; flex-wrap: wrap; gap: .2em 1em; }
.record { display: flex; flex-wrap: wrap; gap: .3em 1.6em; font-family: var(--display); font-size: 1.35vw; color: var(--muted); margin-top: .3vw; }
.record b { color: var(--ink); font-weight: 600; margin-right: .3em; }
.record .last b { color: var(--gold); margin: 0 0 0 .3em; }

/* Up next */
.next {
  background: linear-gradient(var(--gold-wash), var(--gold-wash)), var(--panel);
  border: 1px solid var(--gold-dim); border-top: 3px solid var(--gold); border-radius: 10px; padding: 1.4vw 2vw;
  display: flex; flex-direction: column; gap: .7vw;
}
.next-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1em; }
.next-when { font-family: var(--display); font-size: 1.7vw; color: var(--gold); font-weight: 600; }
.next-title { font-family: var(--display); font-size: 3vw; font-weight: 600; line-height: 1; text-wrap: balance; overflow-wrap: anywhere; }
.next-sub { color: var(--muted); font-size: 1.15em; display: flex; flex-wrap: wrap; gap: .3em 1.2em; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold-hi)); border-radius: 3px; }
.then { border-top: 1px solid var(--gold-dim); padding-top: .9vw; color: var(--muted); }
.then b { color: var(--gold); font-weight: 500; }

/* Agenda */
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2.4vw; min-height: 0; flex: 1; }
.list { display: flex; flex-direction: column; gap: .2vw; min-width: 0; overflow: hidden; -webkit-mask-image: linear-gradient(#000 90%, transparent); mask-image: linear-gradient(#000 90%, transparent); }
.list h3 { margin: 0 0 .6vw; padding-bottom: .5vw; border-bottom: 2px solid var(--gold); }
.ev { display: grid; grid-template-columns: 5.6em minmax(0, 1fr); gap: 0 1em; padding-block: .45vw; border-bottom: 1px solid var(--line); align-items: baseline; }
.ev time { font-family: var(--display); font-size: 1.15em; color: var(--gold); opacity: .8; font-variant-numeric: tabular-nums; }
.ev .t { line-height: 1.2; display: flex; gap: .55em; align-items: baseline; min-width: 0; }
.ev .t span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 1.1em; }
.ev .loc { grid-column: 2; color: var(--muted); font-size: .9em; margin-top: .15em; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev .loc::before { content: "@ "; color: var(--gold-dim); }
.ev.done { opacity: .38; }
.ev.live { background: var(--gold-wash); box-shadow: inset 3px 0 0 var(--gold); padding-inline-start: .5em; }
.ev.live time { opacity: 1; }
.dot { width: .62em; height: .62em; border-radius: 2px; flex: none; transform: translateY(-.05em); }
.allday { display: flex; flex-wrap: wrap; gap: .5em; margin-bottom: .6vw; }
.chip { display: inline-flex; gap: .5em; align-items: center; background: var(--gold-wash); border: 1px solid var(--gold-dim); color: var(--gold-hi); border-radius: 4px; padding: .3em .7em; font-size: .95em; max-width: 100%; }
.chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.day-h { font-family: var(--display); font-size: 1.25em; margin-top: .9vw; color: var(--ink); }
.day-h:first-of-type { margin-top: 0; }
.day-h span { color: var(--gold); font-size: .8em; margin-left: .3em; }
.empty { color: var(--muted); padding-block: .6vw; }
#today { -webkit-mask-image: none; mask-image: none; }
.list h3 .hid { color: var(--muted); letter-spacing: .08em; }
.more { color: var(--muted); font-size: .9em; padding-block: .3vw; }

/* Footer */
.foot { margin-top: auto; display: flex; justify-content: space-between; gap: 1em; flex-wrap: wrap; color: var(--muted); font-size: .85em; }
.legend { display: flex; gap: 1.4em; flex-wrap: wrap; }
.legend span { display: inline-flex; gap: .5em; align-items: center; }
.warn { color: var(--gold); }

@media (max-width: 900px) {
  body { overflow: auto; font-size: 15px; }
  .board { height: auto; grid-template-columns: minmax(0, 1fr); padding-block: 20px; gap: 24px; }
  .col { gap: 20px; }
  .clock { font-size: 26vw; } .date { font-size: 6vw; }
  .wx-now svg { width: 15vw; height: 15vw; } .wx-temp { font-size: 15vw; } .wx-cond { font-size: 5vw; }
  .fday svg { width: 7vw; height: 7vw; } .fday .hi { font-size: 5vw; } .fday { padding-block: 10px; }
  .screen { height: auto; }
  .list { -webkit-mask-image: none; mask-image: none; }
  .game-opp, .game-score { font-size: 8vw; } .game-when { font-size: 5vw; } .record { font-size: 4.5vw; }
  .next { padding: 18px; gap: 10px; } .next-when { font-size: 5vw; } .next-title { font-size: 8vw; }
  .split { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .ev { padding-block: 8px; }
}
@media (prefers-reduced-motion: reduce) { .board { transition: none; } }
</style>
</head>
<body>

<div class="topo" aria-hidden="true"></div>
<div class="screen">
<main class="board" id="board">
  <section class="col">
    <div>
      <div class="clock num" id="clock">–:––</div>
      <div class="date" id="date"></div>
    </div>
    <div class="wx" id="wx" aria-live="polite"></div>
    <div class="game" id="game"></div>
    <div class="foot" id="foot"></div>
  </section>
  <section class="col">
    <div class="next" id="next"></div>
    <div class="split">
      <div class="list" id="today"></div>
      <div class="list" id="ahead"></div>
    </div>
  </section>
</main>
<div class="range" id="range" aria-hidden="true"><div class="flatirons"></div></div>
</div>

<script>
/* ============================================================
   CONFIG — the only part you should need to edit.
   Each calendar key maps to an env var on Cloudflare Pages:
   key "work" -> ICAL_WORK. Add more CU calendars the same way.
   ============================================================ */
const CONFIG = {
  location: { name: "Boulder", lat: 40.0150, lon: -105.2705, tz: "America/Denver" },
  calendars: [
    { key: "work", label: "CU WBB", color: "#cfb87c" },
  ],
  daysAhead: 4,              // days shown in "Coming up"
  // Events whose title matches one of these are left off the board (counted as hidden under Today).
  hide: [
    { label: "PT", match: /\bPT\b/i },          // "A. Foy - PT Appt - Champs"
  ],
  nightDim: { from: 21, to: 6 },  // dim the board between these hours
  calendarRefreshMin: 5,
  weatherRefreshMin: 15,
};

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sod = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const sameDay = (a, b) => sod(a).getTime() === sod(b).getTime();
const fmtTime = d => d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
const fmtShort = d => { const m = d.getMinutes(); const h = d.getHours() % 12 || 12; return m ? `${h}:${String(m).padStart(2, "0")}` : `${h}`; };
const ampm = d => d.getHours() < 12 ? "a" : "p";
function dur(ms) {
  const m = Math.max(0, Math.round(ms / 60000));
  if (m < 60) return `${m} min`;
  const h = Math.floor(m / 60), r = m % 60;
  return r ? `${h} hr ${r} min` : `${h} hr`;
}
function dayName(d, now) {
  if (sameDay(d, now)) return "Today";
  if (sameDay(d, addDays(now, 1))) return "Tomorrow";
  return d.toLocaleDateString("en-US", { weekday: "long" });
}
const calOf = key => CONFIG.calendars.find(c => c.key === key) || { color: "#cfb87c", label: key };
const showDots = () => CONFIG.calendars.length > 1;

/* ---------- state ---------- */
let events = [], hiddenEvents = [];
const isHidden = e => CONFIG.hide.some(h => h.match.test(e.title));
let calStatus = { mode: "loading", failed: [] };
let weather = null, wxSample = false, lastCal = null;

/* ---------- clock ---------- */
function tickClock() {
  const now = new Date();
  const h = now.getHours() % 12 || 12, m = String(now.getMinutes()).padStart(2, "0");
  $("clock").innerHTML = `${h}<span class="colon">:</span>${m}<span class="ap">${now.getHours() < 12 ? "AM" : "PM"}</span>`;
  $("date").innerHTML = `<b>${now.toLocaleDateString("en-US", { weekday: "long" })}</b> ${now.toLocaleDateString("en-US", { month: "long", day: "numeric" })}`;
  const hr = now.getHours(), n = CONFIG.nightDim;
  const night = n.from > n.to ? (hr >= n.from || hr < n.to) : (hr >= n.from && hr < n.to);
  $("board").classList.toggle("night", night); $("range").classList.toggle("night", night);
}

/* ---------- weather ---------- */
const ICON = {
  sun: '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/>',
  moon: '<path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z"/>',
  partly: '<path d="M8 3v1.4M3.2 8H4.6M4.6 4.6l1 1M11.4 4.6l-1 1"/><path d="M5.6 10.4A3 3 0 0 1 10.6 7"/><path d="M9 20h8.5a3.5 3.5 0 0 0 .4-7A5 5 0 0 0 8.4 13.4 3.3 3.3 0 0 0 9 20z"/>',
  cloud: '<path d="M7 19h10.5a4 4 0 0 0 .4-8A6 6 0 0 0 6.3 11.6 3.8 3.8 0 0 0 7 19z"/>',
  fog: '<path d="M4 9h16M3 13h18M5 17h14"/>',
  rain: '<path d="M7 15h10.5a3.8 3.8 0 0 0 .4-7.6A5.8 5.8 0 0 0 6.5 8.1 3.5 3.5 0 0 0 7 15z"/><path d="M8.5 18l-1 2.5M12.5 18l-1 2.5M16.5 18l-1 2.5"/>',
  snow: '<path d="M7 15h10.5a3.8 3.8 0 0 0 .4-7.6A5.8 5.8 0 0 0 6.5 8.1 3.5 3.5 0 0 0 7 15z"/><path d="M8 18.5v.01M12 20v.01M16 18.5v.01M10 21.5v.01M14 21.5v.01" stroke-width="2.4"/>',
  storm: '<path d="M7 15h10.5a3.8 3.8 0 0 0 .4-7.6A5.8 5.8 0 0 0 6.5 8.1 3.5 3.5 0 0 0 7 15z"/><path d="M12.5 15.5l-2 3.5h3l-2 3.5"/>',
};
const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;
function wmo(code, isDay = 1) {
  const c = +code;
  if (c === 0 || c === 1) return [c ? "Mostly clear" : "Clear", isDay ? "sun" : "moon"];
  if (c === 2) return ["Partly cloudy", isDay ? "partly" : "cloud"];
  if (c === 3) return ["Overcast", "cloud"];
  if (c === 45 || c === 48) return ["Fog", "fog"];
  if (c >= 51 && c <= 57) return ["Drizzle", "rain"];
  if (c >= 61 && c <= 67) return [c >= 66 ? "Freezing rain" : c === 65 ? "Heavy rain" : "Rain", "rain"];
  if (c >= 71 && c <= 77) return [c === 75 ? "Heavy snow" : "Snow", "snow"];
  if (c >= 80 && c <= 82) return ["Showers", "rain"];
  if (c === 85 || c === 86) return ["Snow showers", "snow"];
  if (c >= 95) return ["Thunderstorms", "storm"];
  return ["—", "cloud"];
}
async function loadWeather() {
  const L = CONFIG.location;
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${L.lat}&longitude=${L.lon}`
    + `&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,is_day`
    + `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max`
    + `&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=${encodeURIComponent(L.tz)}&forecast_days=5`;
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error(r.status);
    weather = await r.json(); wxSample = false;
  } catch (e) {
    if (!weather) { weather = sampleWeather(); wxSample = true; }
  }
  renderWeather();
}
function renderWeather() {
  if (!weather) return;
  const c = weather.current, d = weather.daily;
  const [cond, icon] = wmo(c.weather_code, c.is_day);
  const days = d.time.map((t, i) => {
    const dt = new Date(t + "T12:00");
    const [, ic] = wmo(d.weather_code[i]);
    const p = d.precipitation_probability_max?.[i];
    return `<div class="fday${i === 0 ? " today" : ""}">
      <span class="label">${i === 0 ? "Today" : dt.toLocaleDateString("en-US", { weekday: "short" })}</span>
      ${svg(ic)}
      <span class="hi num">${Math.round(d.temperature_2m_max[i])}°</span>
      <span class="lo num">${Math.round(d.temperature_2m_min[i])}°</span>
      <span class="pop num">${p >= 20 ? p + "%" : ""}</span></div>`;
  }).join("");
  $("wx").innerHTML = `
    <div class="wx-now">${svg(icon)}
      <div class="wx-temp num">${Math.round(c.temperature_2m)}<sup>°F</sup></div>
      <div class="wx-desc"><div class="wx-cond">${cond}</div>
        <div class="wx-meta num">Feels ${Math.round(c.apparent_temperature)}° · Wind ${Math.round(c.wind_speed_10m)} mph</div>
        <div class="wx-meta">${esc(CONFIG.location.name)}${wxSample ? ' · <span class="warn">sample</span>' : ""}</div></div>
    </div>
    <div class="forecast">${days}</div>`;
}

/* ---------- next game + record ---------- */
let games = null, gamesSample = false;
async function loadGames() {
  try {
    const r = await fetch("/games", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    games = await r.json(); gamesSample = false;
  } catch (e) {
    if (!games) { games = sampleGames(); gamesSample = true; }
  }
  renderGame();
}
function gameDay(d, now) {
  const n = Math.round((sod(d) - sod(now)) / 864e5);
  if (n === 0) return d.getHours() >= 17 ? "Tonight" : "Today";
  if (n === 1) return "Tomorrow";
  return `${n} days`;
}
function gameWhen(g) {
  const d = new Date(g.date);
  const day = d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
  return g.timeValid ? `${day} · ${fmtTime(d)}` : `${day} · Time TBD`;
}
const haLabel = g => g.home ? "vs" : g.neutral ? "vs" : "at";
const oppName = g => `${g.oppRank ? `<span class="rk">#${g.oppRank}</span>` : ""}${esc(g.opp)}`;
function renderGame() {
  if (!games) return;
  const now = new Date(), list = games.events || [];
  const live = list.find(g => g.state === "in");
  const next = list.find(g => g.state === "pre" && new Date(g.date) > new Date(now - 3 * 36e5));
  const done = list.filter(g => g.state === "post" && g.cuScore != null);
  const last = done[done.length - 1];
  const rec = games.record || {};
  let h = "";

  if (live) {
    const cu = +live.cuScore, op = +live.oppScore;
    h += `<div class="game-head"><span class="label">Live now</span><span class="game-when live num">${esc(live.detail)}</span></div>
      <div class="game-score num"><span class="${cu >= op ? "w" : ""}">CU ${cu}</span> – <span class="${op > cu ? "w" : ""}">${op} ${esc(live.oppAbbr || live.opp)}</span></div>
      <div class="game-sub"><span>${haLabel(live)} ${esc(live.opp)}</span>${live.tv.length ? `<span>${esc(live.tv.join(" / "))}</span>` : ""}</div>`;
  } else if (next) {
    const d = new Date(next.date);
    const where = next.home ? next.venue : [next.venue, next.city].filter(Boolean).join(", ");
    h += `<div class="game-head"><span class="label">${rec.played ? "Next game" : "Season opener"}</span><span class="game-when num">${gameDay(d, now)}</span></div>
      <div class="game-opp"><span class="ha">${haLabel(next)}</span>${oppName(next)}</div>
      <div class="game-sub num"><span>${gameWhen(next)}</span>${where ? `<span>${esc(where)}</span>` : ""}${next.tv.length ? `<span>${esc(next.tv.join(" / "))}</span>` : ""}</div>`;
  } else {
    h += `<div class="game-head"><span class="label">${esc(games.season || "Season")}</span></div>
      <div class="game-opp">Season complete</div>`;
  }

  if (rec.played) {
    const lastTxt = last ? `${last.win ? "W" : "L"} ${last.cuScore}-${last.oppScore} ${haLabel(last)} ${esc(last.oppAbbr || last.opp)}` : "";
    h += `<div class="record num"><span><b>${esc(rec.overall)}</b>overall</span>
      ${rec.conf && rec.conf !== "0-0" ? `<span><b>${esc(rec.conf)}</b>Big 12</span>` : ""}
      ${rec.streak ? `<span><b>${esc(rec.streak)}</b>streak</span>` : ""}
      ${lastTxt ? `<span class="last">Last <b>${lastTxt}</b></span>` : ""}
      ${gamesSample ? '<span class="warn">sample</span>' : ""}</div>`;
  } else {
    h += `<div class="record num"><span>${esc(games.season || "")} season · 0-0</span>${gamesSample ? '<span class="warn">sample</span>' : ""}</div>`;
  }
  $("game").innerHTML = h;
}

/* ---------- calendars ---------- */
function parseICS(text, cal, ws, we) {
  const out = [];
  const comp = new ICAL.Component(ICAL.parse(text));
  comp.getAllSubcomponents("vtimezone").forEach(tz => { try { ICAL.TimezoneService.register(tz); } catch (e) {} });
  const masters = [], exceptions = [];
  comp.getAllSubcomponents("vevent").forEach(ve => {
    const ev = new ICAL.Event(ve);
    (ev.isRecurrenceException() ? exceptions : masters).push(ev);
  });
  exceptions.forEach(ex => { const m = masters.find(m => m.uid === ex.uid); if (m) { try { m.relateException(ex); } catch (e) {} } else masters.push(ex); });
  const push = (item, s, e) => {
    if ((item.component.getFirstPropertyValue("status") || "").toUpperCase() === "CANCELLED") return;
    const start = s.toJSDate();
    let end = e ? e.toJSDate() : new Date(start.getTime() + (s.isDate ? 864e5 : 0));
    if (end <= start) end = new Date(start.getTime() + (s.isDate ? 864e5 : 0));
    if (end <= ws || start >= we) return;
    out.push({ title: item.summary || "(No title)", location: item.location || "", start, end, allDay: s.isDate, cal: cal.key });
  };
  masters.forEach(ev => {
    if (ev.isRecurring()) {
      const it = ev.iterator(); let next, n = 0;
      while ((next = it.next()) && n++ < 8000) {
        if (next.toJSDate() >= we) break;
        const o = ev.getOccurrenceDetails(next);
        push(o.item, o.startDate, o.endDate);
      }
    } else push(ev, ev.startDate, ev.endDate);
  });
  return out;
}
async function loadCalendars() {
  const now = new Date(), ws = sod(now), we = addDays(ws, CONFIG.daysAhead + 1);
  const results = await Promise.allSettled(CONFIG.calendars.map(async c => {
    if (typeof ICAL === "undefined") throw new Error("calendar parser didn't load");
    let r;
    try { r = await fetch(`/ical?cal=${encodeURIComponent(c.key)}`, { cache: "no-store" }); }
    catch (e) { throw new Error("can't reach /ical"); }
    const t = await r.text();
    if (!r.ok) throw new Error(`${r.status}: ${t.slice(0, 140)}`);
    if (!t.includes("BEGIN:VCALENDAR")) throw new Error(/<html/i.test(t) ? "got a web page instead of a calendar (sign-in page or wrong link)" : "response isn't a calendar file");
    return parseICS(t, c, ws, we);
  }));
  const ok = results.filter(r => r.status === "fulfilled");
  const failed = CONFIG.calendars.map((c, i) => results[i].status === "rejected" ? `${c.label}: ${results[i].reason?.message || results[i].reason}` : null).filter(Boolean);
  if (ok.length) {
    const all = ok.flatMap(r => r.value).sort((a, b) => a.start - b.start || a.end - b.end);
    events = all.filter(e => !isHidden(e));
    hiddenEvents = all.filter(isHidden);
    calStatus = { mode: "live", failed }; lastCal = new Date();
  } else if (calStatus.mode !== "live") {
    const all = sampleEvents(); events = all.filter(e => !isHidden(e)); hiddenEvents = all.filter(isHidden); calStatus = { mode: "sample", failed };
  } else {
    calStatus = { mode: "live", failed }; // keep last good events
  }
  render();
}

/* ---------- render agenda ---------- */
const dot = e => showDots() ? `<i class="dot" style="background:${calOf(e.cal).color}"></i>` : "";
function evRow(e, now) {
  const cls = e.end <= now ? "done" : e.start <= now ? "live" : "";
  return `<div class="ev ${cls}"><time>${fmtShort(e.start)}${ampm(e.start)}</time>
    <div class="t">${dot(e)}<span>${esc(e.title)}</span></div>${e.location ? `<div class="loc">${esc(e.location)}</div>` : ""}</div>`;
}
const chip = e => `<span class="chip">${dot(e)}<span>${esc(e.title)}</span></span>`;
function render() {
  const now = new Date();
  const timed = events.filter(e => !e.allDay);
  const current = timed.filter(e => e.start <= now && e.end > now);
  const upcoming = timed.filter(e => e.start > now);

  // Up next card
  let html;
  const hero = current[0] || upcoming[0];
  if (!hero) {
    html = `<div class="next-head"><span class="label">Up next</span></div>
      <div class="next-title">Nothing scheduled</div>
      <div class="next-sub">The next ${CONFIG.daysAhead + 1} days are clear.</div>`;
  } else {
    const isNow = hero.start <= now;
    const when = isNow ? `${dur(hero.end - now)} left`
      : sameDay(hero.start, now) ? `in ${dur(hero.start - now)}`
      : `${dayName(hero.start, now)} ${fmtTime(hero.start)}`;
    const pct = isNow ? Math.min(100, (now - hero.start) / (hero.end - hero.start) * 100) : 0;
    const after = isNow ? (current[1] || upcoming[0]) : upcoming[1];
    html = `<div class="next-head"><span class="label">${isNow ? "Happening now" : "Up next"}</span><span class="next-when num">${when}</span></div>
      <div class="next-title">${esc(hero.title)}</div>
      <div class="next-sub num"><span>${fmtTime(hero.start)} – ${fmtTime(hero.end)}</span>
        ${hero.location ? `<span>${esc(hero.location)}</span>` : ""}</div>
      ${isNow ? `<div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div>` : ""}
      ${after ? `<div class="then num">Then <b>${esc(after.title)}</b> · ${sameDay(after.start, now) ? fmtTime(after.start) : dayName(after.start, now) + " " + fmtTime(after.start)}</div>` : ""}`;
  }
  $("next").innerHTML = html;

  // Today
  const todayAll = events.filter(e => e.allDay && e.start <= now && e.end > now);
  const todayTimed = timed.filter(e => sameDay(e.start, now));
  const hiddenToday = hiddenEvents.filter(e => sameDay(e.start, now) || (e.allDay && e.start <= now && e.end > now));
  const hiddenNote = hiddenToday.length
    ? ` <span class="hid">· ${CONFIG.hide.map(h => { const n = hiddenToday.filter(e => h.match.test(e.title)).length; return n ? `${n} ${h.label} hidden` : ""; }).filter(Boolean).join(", ")}</span>` : "";
  let t = `<h3 class="label">Today · ${todayTimed.length} event${todayTimed.length === 1 ? "" : "s"}${hiddenNote}</h3>`;
  if (todayAll.length) t += `<div class="allday">${todayAll.map(chip).join("")}</div>`;
  t += todayTimed.length ? todayTimed.map(e => evRow(e, now)).join("") : `<div class="empty">Nothing on the calendar today.</div>`;
  const todayEl = $("today");
  todayEl.innerHTML = t;
  fitToColumn(todayEl);

  // Coming up
  let a = `<h3 class="label">Coming up</h3>`;
  for (let i = 1; i <= CONFIG.daysAhead; i++) {
    const d = addDays(sod(now), i), dEnd = addDays(d, 1);
    const all = events.filter(e => e.allDay && e.start < dEnd && e.end > d);
    const tm = timed.filter(e => sameDay(e.start, d));
    if (!all.length && !tm.length) continue;
    a += `<div class="day-h">${dayName(d, now)}<span>${d.toLocaleDateString("en-US", { month: "short", day: "numeric" })}</span></div>`;
    if (all.length) a += `<div class="allday">${all.map(chip).join("")}</div>`;
    a += tm.slice(0, 2).map(e => evRow(e, now)).join("");
    if (tm.length > 2) a += `<div class="more">+${tm.length - 2} more</div>`;
  }
  if (a.endsWith("</h3>")) a += `<div class="empty">Clear for the next ${CONFIG.daysAhead} days.</div>`;
  $("ahead").innerHTML = a;

  // Footer
  const status = calStatus.mode === "sample" ? `<span class="warn">Sample calendar · ${calStatus.failed.length ? esc(calStatus.failed.join(" | ")) : "connect your feed to go live"}</span>`
    : calStatus.mode === "loading" ? "Loading calendar…"
    : `Calendar synced ${lastCal ? fmtTime(lastCal) : ""}${calStatus.failed.length ? ` · <span class="warn">${esc(calStatus.failed.join(" | "))}</span>` : ""}`;
  const legend = showDots() ? `<div class="legend">${CONFIG.calendars.map(c => `<span><i class="dot" style="background:${c.color}"></i>${esc(c.label)}</span>`).join("")}</div>` : "";
  $("foot").innerHTML = `${legend}<div>${status}</div>`;
}

/* Shrink a list's text until every row fits its column (busy days). */
function fitToColumn(el) {
  el.style.fontSize = "";
  if (window.matchMedia("(max-width: 900px)").matches) return;
  let s = 1;
  while (el.scrollHeight > el.clientHeight + 1 && s > 0.62) {
    s -= 0.04;
    el.style.fontSize = s + "em";
  }
}

/* ---------- sample data (preview only; clearly flagged on screen) ---------- */
function sampleEvents() {
  const now = new Date(), d0 = sod(now);
  const at = (day, h, m = 0) => new Date(d0.getFullYear(), d0.getMonth(), d0.getDate() + day, h, m);
  const mk = (title, s, mins, location = "") => ({ title, cal: "work", start: s, end: new Date(s.getTime() + mins * 6e4), allDay: false, location });
  const base = new Date(now); base.setMinutes(0, 0, 0);
  const rel = (h, m) => new Date(base.getTime() + (h * 60 + m) * 6e4);
  const ad = (title, day, len = 1) => ({ title, cal: "work", start: at(day, 0), end: at(day + len, 0), allDay: true, location: "" });

    mk("Staff meeting", rel(-2, 0), 60, "Basketball office"),

    mk("A. Foy - PT Appt - Champs", rel(2, 0), 30, "Champs Training Room"),
    mk("Treatment", rel(-4, 0), 30, "Champs Training Room"),
    mk("Chiropractor available", rel(-3, 0), 60, "Champs Training Room"),
    mk("Recruiting calls", rel(3, 0), 60),
    mk("Disney VP Speaking", rel(5, 0), 60, "Arapahoe Hall 2nd Floor Rm 240"),
    ad("WBB Off Day", 1),
    mk("Monthly Compliance Meeting", at(1, 10), 60, "CUEC Film Room"),
    mk("Scouting meeting", at(1, 13), 60),
    mk("WBB Weights", at(1, 16, 30), 60),
    mk("WBB Practice", at(2, 13, 15), 120, "Arena/Lower"),
    mk("Recruiting calls", at(2, 16), 60),
    mk("WBB Practice", at(3, 13, 15), 120, "Arena/Lower"),

  ].sort((a, b) => a.start - b.start);
}
function sampleGames() {
  const now = new Date(), at = (days, h, m = 0) => { const d = addDays(sod(now), days); d.setHours(h, m); return d.toISOString(); };
  const g = (date, opp, abbr, home, state, cuScore, oppScore, extra = {}) => ({ date, timeValid: true, home, neutral: false, opp, oppAbbr: abbr, oppRank: null,
    venue: home ? "CU Events Center" : "Away arena", city: home ? "Boulder, CO" : "", tv: home ? ["ESPN+"] : [], state, detail: "", cuScore, oppScore,
    win: state === "post" ? cuScore > oppScore : null, ...extra });
  return { season: "2026-27", standing: null, events: [
    g(at(-9, 18), "Morgan State", "MORG", true, "post", 84, 61),
    g(at(-6, 13), "Fresno State", "FRES", true, "post", 77, 64),
    g(at(-3, 20), "San Diego State", "SDSU", false, "post", 70, 66),
    g(at(3, 18), "Baylor", "BAY", true, "pre", null, null, { oppRank: 9, tv: ["ESPN+"] }),
  ], record: { overall: "3-0", conf: "0-0", streak: "W3", played: 3 } };
}
function sampleWeather() {
  const d0 = new Date(); const t = [0, 1, 2, 3, 4].map(i => { const x = addDays(d0, i); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`; });
  return { current: { temperature_2m: 54, apparent_temperature: 52, weather_code: 2, wind_speed_10m: 7, is_day: 1 },
    daily: { time: t, weather_code: [2, 0, 3, 61, 1], temperature_2m_max: [66, 71, 63, 55, 64], temperature_2m_min: [41, 44, 42, 38, 39], precipitation_probability_max: [5, 0, 15, 60, 10] } };
}

/* ---------- TV care: burn-in shift, wake lock, daily reload ---------- */
let shift = 0;
function nudge() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const p = [[0, 0], [3, 2], [-2, 3], [2, -3], [-3, -2]][shift++ % 5];
  $("board").style.transform = `translate(${p[0]}px, ${p[1]}px)`;
}
async function keepAwake() { try { await navigator.wakeLock?.request("screen"); } catch (e) {} }
document.addEventListener("visibilitychange", () => { if (!document.hidden) keepAwake(); });

/* ---------- boot ---------- */
tickClock(); render();
loadWeather(); loadCalendars(); loadGames(); keepAwake();
setInterval(() => (games?.events || []).some(g => g.state === "in") ? loadGames() : renderGame(), 60 * 1000);
setInterval(loadGames, 10 * 6e4);
setInterval(tickClock, 1000);
setInterval(render, 15000);
setInterval(loadCalendars, CONFIG.calendarRefreshMin * 6e4);
setInterval(loadWeather, CONFIG.weatherRefreshMin * 6e4);
setInterval(nudge, 5 * 6e4);
(function scheduleReload() {
  const n = new Date(), t = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1, 3, 0);
  setTimeout(() => location.reload(), t - n);
})();
</script>
